# 内网部署：
#   1. cp .env.example .env，填 SITE_HOSTS（服务器内网 IP / 主机名）和 POSTGRES_PASSWORD
#   2. cp backend/.env.example backend/.env，填 SECRET_KEY、ADMIN_PASSWORD、DEEPSEEK_API_KEY
#   3. docker compose up -d --build
#   4. 手机先打开 http://服务器地址/install 安装证书，再用 https://服务器地址 访问
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: workrecord
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:-app}@db:5432/workrecord
    expose:
      - "8000"            # 只给 Caddy 访问，不直接对外
    volumes:
      - uploads:/app/data/uploads   # 任务图片（原图 + 浏览图 + 缩略图），注意备份

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOSTS: ${SITE_HOSTS:?请在 .env 里填 SITE_HOSTS，例如 192.168.1.50}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/install:/srv/install:ro
      - caddy_data:/data      # 内部 CA 的根证书和私钥在这里，备份它；丢了要让所有手机重装证书
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
