# 数据库迁移配置。数据库地址不写在这里，统一从 backend/.env（DATABASE_URL）读取。
#
# 常用命令（在 backend 目录下）：
#   升级到最新：        python -m alembic upgrade head
#   查看当前版本：      python -m alembic current
#   改了 models.py 后生成迁移：python -m alembic revision --autogenerate -m "说明"
#   退回上一版：        python -m alembic downgrade -1

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
