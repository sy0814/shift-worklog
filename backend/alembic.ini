# Database migration config. KEEP THIS FILE ASCII-ONLY: on Chinese Windows,
# Alembic reads it with the system code page (GBK) and non-ASCII text breaks it.
# The database URL is not here; it comes from backend/.env (DATABASE_URL).
#
# Common commands (run in the backend folder):
#   upgrade to latest:        python -m alembic upgrade head
#   show current version:     python -m alembic current
#   new migration after editing models.py:
#                             python -m alembic revision --autogenerate -m "what changed"
#   go back one version:      python -m alembic downgrade -1

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
