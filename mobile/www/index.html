<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
  <script src="common.js"></script>
  <script>
    // 已经填过地址、不是从「修改服务器地址」进来的：直接打开系统
    if (getServer() && location.search.indexOf('setup') < 0) openServer(getServer());
  </script>
</head>
<body>
  <div class="box">
    <h1 data-t="title"></h1>
    <form id="f">
      <label for="addr" data-t="addr"></label>
      <input id="addr" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.60" />
      <div class="hint" data-t="hint"></div>
      <div id="err" class="err"></div>
      <button type="submit" data-t="go"></button>
    </form>
  </div>
  <script>
    fill();
    var input = document.getElementById('addr');
    input.value = getServer();
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var a = cleanAddr(input.value);
      if (!a) { document.getElementById('err').textContent = TXT.bad; return; }
      setServer(a);
      openServer(a);
    });
  </script>
</body>
</html>
