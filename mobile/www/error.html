<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="style.css" />
  <script src="common.js"></script>
</head>
<body>
  <!-- 打不开服务器时（没连厂里 Wi-Fi、地址变了、服务器停了）Capacitor 显示这一页 -->
  <div class="box">
    <div class="icon">📡</div>
    <h1 data-t="fail"></h1>
    <div class="hint" data-t="failHint"></div>
    <div class="hint"><span data-t="now"></span><b id="cur"></b></div>
    <button id="retry" data-t="retry"></button>
    <button id="change" class="plain" data-t="change"></button>
  </div>
  <script>
    fill();
    document.getElementById('cur').textContent = getServer() || '—';
    document.getElementById('retry').onclick = function () { if (getServer()) openServer(getServer()); else location.replace('index.html?setup=1'); };
    document.getElementById('change').onclick = function () { location.replace('index.html?setup=1'); };
  </script>
</body>
</html>
