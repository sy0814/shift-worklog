# 每次推送和每个 PR 自动检查：后端测试（SQLite 和 PostgreSQL 各跑一遍）、前端构建、Windows 脚本格式。
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: 后端测试（SQLite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  backend-postgres:
    name: 后端测试（PostgreSQL 16）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wrtest
          POSTGRES_PASSWORD: wrtest
          POSTGRES_DB: wrtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wrtest" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://wrtest:wrtest@127.0.0.1:5432/wrtest
      TEST_PG_URL: postgresql+psycopg://wrtest:wrtest@127.0.0.1:5432/wrmig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: 建迁移测试用的第二个库
        run: PGPASSWORD=wrtest psql -h 127.0.0.1 -U wrtest -d wrtest -c "CREATE DATABASE wrmig"
      - name: pytest
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  windows-scripts:
    name: Windows 脚本格式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_ps1.py
